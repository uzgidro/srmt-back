name: CI/CD Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/srmt-back

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

  verify-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  trigger-watchtower:
    runs-on: ubuntu-latest
    needs: verify-image

    steps:
      - name: Trigger Watchtower Update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.WATCHTOWER_SECRET }}" \
            https://${{ secrets.WATCHTOWER_HOST }}/v1/update

  update-k8s-manifest:
    runs-on: ubuntu-latest
    needs: verify-image

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITOPS_SSH_KEY }}

      - name: Update and Push Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          git clone git@github.com:${{ github.repository_owner }}/GitOps-Repo.git gitops
          cd gitops

          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|g" apps/srmt-back/overlays/dev/kustomization.yaml

          if [[ -n $(git status --porcelain) ]]; then
            git add apps/srmt-back/overlays/dev/kustomization.yaml
            git commit -m "deploy(dev): ${{ github.sha }}"
            git push
          else
            echo "No changes to commit"
          fi
